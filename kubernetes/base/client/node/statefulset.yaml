apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: client-node
spec:
  selector:
    matchLabels: {}
  serviceName: client-node
  replicas: 1
  template:
    spec:
      containers:
      - name: sleep
        image: zookage-util
        args:
        - sleep
        - inf
        envFrom:
        - configMapRef:
            name: hadoop-env
        - configMapRef:
            name: hbase-env
        - configMapRef:
            name: hive-env
        - configMapRef:
            name: ozone-env
        - configMapRef:
            name: spark-env
        - configMapRef:
            name: tez-env
        - configMapRef:
            name: trino-env
        - configMapRef:
            name: zookeeper-env
        - secretRef:
            name: aws-secret-env
        - secretRef:
            name: spark-secret-env
        env:
        - name: PATH
          # yamllint disable-line rule:line-length
          value: $(TRINO_HOME)/trino-cli/bin:$(HBASE_HOME)/bin:$(HIVE_HOME)/bin:$(OZONE_HOME)/bin:$(SPARK_HOME)/bin:$(HADOOP_HOME)/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        volumeMounts:
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: client-secret
          mountPath: /run/secrets/zookage/client
        - name: hadoop-conf
          mountPath: /etc/hadoop/conf
        - name: shared-conf
          mountPath: /etc/zookage/shared
        - name: hadoop-secret
          mountPath: /run/secrets/zookage/hadoop
        - name: hadoop-src
          mountPath: /opt/hadoop
          subPath: opt/hadoop
        workingDir: /home/zookage
      terminationGracePeriodSeconds: 0
      volumes:
      - name: shared-conf
        configMap:
          name: shared-conf
      - name: kerberos-conf
        configMap:
          name: kerberos-conf
      - name: client-secret
        secret:
          secretName: client-secret
      - name: hadoop-conf
        projected:
          sources:
          - configMap:
              name: hadoop-conf
          - configMap:
              name: hdfs-conf
          - configMap:
              name: mapreduce-conf
          - configMap:
              name: yarn-conf
      - name: hadoop-secret
        secret:
          secretName: hadoop-secret
      - name: hadoop-src
        image:
          reference: zookage-hadoop
          pullPolicy: IfNotPresent
