connector.name=hive
hive.metastore.uri=thrift://hive-metastore-server-0.hive-metastore-server:9083
fs.hadoop.enabled=true
hive.config.resources=/etc/hadoop/conf/core-site.xml,/etc/hadoop/conf/hdfs-site.xml
{{- if eq (index .Values "hadoop_security_authentication") "kerberos" }}
hive.metastore.authentication.type=KERBEROS
hive.metastore.service.principal=hive/hive-metastore-server.zookage.svc.cluster.local@ZOOKAGE.LOCAL
hive.metastore.client.principal=trino/trino-coordinator.zookage.svc.cluster.local@ZOOKAGE.LOCAL
hive.metastore.client.keytab=/etc/secrets/trino-kerberos/trino.keytab
hive.hdfs.authentication.type=KERBEROS
hive.hdfs.trino.principal=trino/trino-coordinator.zookage.svc.cluster.local@ZOOKAGE.LOCAL
hive.hdfs.trino.keytab=/etc/secrets/trino-kerberos/trino.keytab
{{- end }}
hive.non-managed-table-writes-enabled=true
hive.temporary-staging-directory-path=/tmp/trino/trino/staging

fs.native-s3.enabled=true
s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
s3.endpoint=http://ozone-s3g:9878
s3.region=default
s3.path-style-access=true
