catalog=hive
{{- if eq (index .Values "hadoop_security_authentication") "kerberos" }}
server=https://trino-coordinator.zookage.svc.cluster.local:8443
truststore-path=/etc/zookage/shared/zookage-truststore.jks
truststore-password=zookage
krb5-config-path=/etc/krb5.conf
krb5-principal=zookage@ZOOKAGE.LOCAL
krb5-keytab-path=/etc/secrets/client/client.keytab
krb5-remote-service-name=HTTP
krb5-disable-remote-service-hostname-canonicalization=true
{{- else }}
server=http://trino-coordinator-0.trino-coordinator:8090
{{- end }}
