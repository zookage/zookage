coordinator=true
node-scheduler.include-coordinator=false
http-server.http.port=8090
discovery.uri=http://trino-coordinator-0.trino-coordinator:8090

{{- if eq (index .Values "hadoop_security_authentication") "kerberos" }}
internal-communication.shared-secret=${ENV:TRINO_INTERNAL_SHARED_SECRET}
http-server.authentication.type=KERBEROS
http-server.authentication.krb5.service-name=HTTP
http-server.authentication.krb5.principal-hostname=trino-coordinator.zookage.svc.cluster.local
http-server.authentication.krb5.keytab=/etc/secrets/trino-kerberos/trino.keytab
http-server.authentication.krb5.user-mapping.pattern=^([^/@]+)@ZOOKAGE[.]LOCAL$
http.authentication.krb5.config=/etc/krb5.conf
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/secrets/trino-tls/trino-coordinator.jks
http-server.https.keystore.key=trino-http
web-ui.authentication.type=KERBEROS
{{- else }}
web-ui.authentication.type=fixed
web-ui.user=admin
{{- end }}

access-control.config-files={{ or (index .Values "trino_access_control_config_files") "/etc/trino/conf/access-control-default.properties" }}
