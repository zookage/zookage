tickTime=2000
initLimit=50
syncLimit=5
dataDir=/mnt/zookeeper
{{ if eq (index .Values "zookeeper_security_authentication") "kerberos" }}
secureClientPort=2181
serverCnxnFactory=org.apache.zookeeper.server.NettyServerCnxnFactory
authProvider.1=org.apache.zookeeper.server.auth.SASLAuthenticationProvider
enforce.auth.enabled=true
enforce.auth.schemes=sasl
kerberos.removeHostFromPrincipal=true
kerberos.removeRealmFromPrincipal=true
quorum.auth.enableSasl=true
quorum.auth.learnerRequireSasl=true
quorum.auth.serverRequireSasl=true
quorum.auth.kerberos.servicePrincipal=zookeeper/_HOST
ssl.keyStore.location=/etc/secrets/zookeeper/zookeeper.jks
ssl.keyStore.password=zookage
ssl.trustStore.location=/etc/zookeeper/conf/zookage-truststore.jks
ssl.trustStore.password=zookage
ssl.enabledProtocols=TLSv1.2,TLSv1.3
ssl.clientAuth=need
ssl.quorum.keyStore.location=/etc/secrets/zookeeper/zookeeper.jks
ssl.quorum.keyStore.password=zookage
ssl.quorum.trustStore.location=/etc/zookeeper/conf/zookage-truststore.jks
ssl.quorum.trustStore.password=zookage
ssl.quorum.enabledProtocols=TLSv1.2,TLSv1.3
admin.forceHttps=true
admin.needClientAuth=true
{{ else }}
clientPort=2181
{{ end }}
maxCnxns=60
leaderConnectDelayDuringRetryMs=20000
electionPortBindRetry=50
server.1=zookeeper-server-0.zookeeper-server.zookage.svc.cluster.local:2888:3888
server.2=zookeeper-server-1.zookeeper-server.zookage.svc.cluster.local:2888:3888
server.3=zookeeper-server-2.zookeeper-server.zookage.svc.cluster.local:2888:3888
