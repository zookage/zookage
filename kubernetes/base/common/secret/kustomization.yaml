apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
- includeSelectors: true
  pairs:
    component: secret
secretGenerator:
- files:
  - client/client.keytab
  name: client-secret
- literals:
  - AWS_ACCESS_KEY_ID=zookage
  - AWS_SECRET_ACCESS_KEY=zookage-dummy
  name: aws-secret
- literals:
  - TRINO_REST_CATALOG_OAUTH2_CLIENT_ID=trino
  - TRINO_REST_CATALOG_OAUTH2_CLIENT_SECRET=trino
  name: trino-secret
- files:
  - trino/trino.keytab
  name: trino-kerberos-secret
- files:
  - hadoop/hadoop.jceks
  name: hadoop-secret
- files:
  - hbase/hbase.keytab
  name: hbase-secret
- files:
  - hdfs/hdfs.jks
  - hdfs/hdfs.keytab
  - hdfs/httpfs-signature.secret
  name: hdfs-secret
- files:
  - keycloak-server/keycloak-server.jks
  literals:
  - KC_HTTPS_KEY_STORE_PASSWORD=zookage
  name: keycloak-server-secret
- files:
  - hive/hive-zookeeper-client.jks
  - hive/hive.keytab
  name: hive-secret
- files:
  - hive-metastore/hive-metastore.jceks
  name: hive-metastore-secret
- files:
  - mapreduce/mapreduce.keytab
  name: mapreduce-secret
- files:
  - ozone/ozone-http-auth-signature.secret
  - ozone/ozone.keytab
  name: ozone-secret
- files:
  - ranger/ranger.keytab
  name: ranger-secret
- files:
  - spark/spark.keytab
  literals:
  - SPARK_JWS_SECRET_KEY=sb3XQK_dKB-L2Q-Ms0RDSCWpoM-Jdgbx9cUA46K-2js
  name: spark-secret
- files:
  - tez/tez.keytab
  name: tez-secret
- files:
  - yarn/yarn.keytab
  name: yarn-secret
- files:
  - zookeeper/zookeeper.jks
  - zookeeper/zookeeper.keytab
  name: zookeeper-secret
- files:
  - zookeeper-client/zookeeper-client.jks
  - zookeeper-client/zookeeper-client.p12
  name: zookeeper-client-secret
