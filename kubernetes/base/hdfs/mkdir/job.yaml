apiVersion: batch/v1
kind: Job
metadata:
  name: hdfs-mkdir
spec:
  template:
    spec:
      securityContext:
        supplementalGroups:
        - 1010
      initContainers:
      - name: wait-for-httpfs
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/hdfs-httpfs
      containers:
      - name: mkdir
        image: zookage-util
        command:
        - /bin/bash
        args:
        - -c
        - |
          set -eu
          HADOOP_SECURITY_AUTHENTICATION=$("${HADOOP_HOME}/bin/hdfs" getconf -confKey hadoop.security.authentication)
          export HADOOP_SECURITY_AUTHENTICATION
          if [[ ${HADOOP_SECURITY_AUTHENTICATION} == kerberos ]]; then
            kinit -kt /etc/secrets/hdfs/hdfs.keytab hdfs/hdfs-mkdir@ZOOKAGE.LOCAL
          fi
          docker-entrypoint.sh hdfs-mkdir /apps hdfs:supergroup 755
          docker-entrypoint.sh hdfs-mkdir /apps/hbase hbase:hbase 711
          docker-entrypoint.sh hdfs-mkdir /apps/hive-warehouse hive:warehouse 1770
          docker-entrypoint.sh hdfs-mkdir /apps/mapred-history-intermediate mapred:mapred 1777
          docker-entrypoint.sh hdfs-mkdir /apps/mapred-history mapred:mapred 750
          docker-entrypoint.sh hdfs-mkdir /apps/spark-history spark:spark 1777
          docker-entrypoint.sh hdfs-mkdir /lib hdfs:supergroup 755
          docker-entrypoint.sh hdfs-mkdir /lib/tez tez:tez 755
          docker-entrypoint.sh hdfs-mkdir /tmp hdfs:supergroup 1777
          docker-entrypoint.sh hdfs-mkdir /tmp/hadoop-yarn yarn:hadoop 775
          docker-entrypoint.sh hdfs-mkdir /tmp/hadoop-yarn/staging yarn:hadoop 1777
          docker-entrypoint.sh hdfs-mkdir /user hdfs:supergroup 711
          docker-entrypoint.sh hdfs-mkdir /user/hive hive:hive 700
          docker-entrypoint.sh hdfs-mkdir /user/zookage zookage:zookage 700
        envFrom:
        - configMapRef:
            name: hadoop-env
        env:
        - name: HADOOP_USER_NAME
          value: hdfs
        volumeMounts:
        - name: hadoop-conf
          mountPath: /etc/hadoop/conf
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: hdfs-secret
          mountPath: /etc/secrets/hdfs
        - name: hadoop-src
          mountPath: /opt/hadoop
          subPath: opt/hadoop
      restartPolicy: Never
      volumes:
      - name: hadoop-conf
        projected:
          sources:
          - configMap:
              name: hadoop-conf
          - configMap:
              name: hdfs-conf
      - name: hadoop-src
        image:
          reference: zookage-hadoop
          pullPolicy: IfNotPresent
      - name: kerberos-conf
        configMap:
          name: kerberos-conf
      - name: hdfs-secret
        secret:
          secretName: hdfs-secret
