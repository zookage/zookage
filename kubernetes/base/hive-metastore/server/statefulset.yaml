apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hive-metastore-server
spec:
  selector:
    matchLabels: {}
  serviceName: hive-metastore-server
  replicas: 1
  template:
    spec:
      initContainers:
      - name: wait-for-postgres
        image: zookage-util
        args:
        - wait-for-rollout
        - statefulset/postgres-database
      - name: create-hive-database
        image: zookage-postgres
        command:
        - /bin/bash
        args:
        - -c
        - |
          set -euo pipefail

          postgres_url='postgresql://admin:admin@postgres-database-0.postgres-database:5432'
          if ! psql "${postgres_url}" -tc "SELECT 1 FROM pg_database WHERE datname = 'hive'" | grep -q 1; then
            psql "${postgres_url}" -c 'CREATE DATABASE hive'
          fi
      - name: wait-for-warehouse-dir
        image: zookage-util
        args:
        - wait-for-job
        - hdfs-mkdir
      - name: init-schema
        image: zookage-hive-metastore
        command:
        - $(METASTORE_HOME)/bin/schematool
        args:
        - -initOrUpgradeSchema
        - -dbType
        - postgres
        envFrom:
        - configMapRef:
            name: hadoop-env
        - configMapRef:
            name: hive-metastore-env
        - configMapRef:
            name: tez-env
        volumeMounts:
        - name: hadoop-conf
          mountPath: /etc/hadoop/conf
        - name: hadoop-secret
          mountPath: /run/secrets/zookage/hadoop
        - name: hive-metastore-conf
          mountPath: /etc/hive-metastore/conf
        - name: hive-metastore-secret
          mountPath: /run/secrets/zookage/hive-metastore
        - name: hive-secret
          mountPath: /run/secrets/zookage/hive
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: tez-conf
          mountPath: /etc/tez/conf
        - name: mnt
          mountPath: /mnt
        - name: hadoop-src
          mountPath: /opt/hadoop
          subPath: opt/hadoop
      containers:
      - name: metastore
        image: zookage-hive-metastore
        command:
        - $(METASTORE_HOME)/bin/start-metastore
        envFrom:
        - configMapRef:
            name: hadoop-env
        - configMapRef:
            name: hive-metastore-env
        - configMapRef:
            name: java-env
        readinessProbe:
          # A bare connection to the SASL Thrift port is logged as an error.
          tcpSocket:
            port: 9001
        volumeMounts:
        - name: hadoop-conf
          mountPath: /etc/hadoop/conf
        - name: hadoop-secret
          mountPath: /run/secrets/zookage/hadoop
        - name: hive-metastore-conf
          mountPath: /etc/hive-metastore/conf
        - name: hive-metastore-secret
          mountPath: /run/secrets/zookage/hive-metastore
        - name: hive-secret
          mountPath: /run/secrets/zookage/hive
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: mnt
          mountPath: /mnt
        - name: hadoop-src
          mountPath: /opt/hadoop
          subPath: opt/hadoop
      terminationGracePeriodSeconds: 5
      volumes:
      - name: hadoop-conf
        projected:
          sources:
          - configMap:
              name: hadoop-client-conf
          - configMap:
              name: hdfs-conf
      - name: hadoop-secret
        projected:
          sources:
          - secret:
              name: hadoop-secret
          - secret:
              name: s3a-secret
      - name: hive-metastore-conf
        configMap:
          name: hive-metastore-conf
      - name: hive-metastore-secret
        secret:
          secretName: hive-metastore-secret
      - name: hive-secret
        secret:
          secretName: hive-secret
          defaultMode: 0444
      - name: kerberos-conf
        configMap:
          name: kerberos-conf
      - name: tez-conf
        configMap:
          name: tez-conf
      - name: mnt
        emptyDir: {}
      - name: hadoop-src
        image:
          reference: zookage-hadoop
          pullPolicy: IfNotPresent
