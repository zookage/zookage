apiVersion: apps/v1
kind: Deployment
metadata:
  name: kerberos-kdc
spec:
  replicas: 1
  selector:
    matchLabels: {}
  template:
    spec:
      initContainers:
      - name: wait-for-openldap
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/openldap-server
      containers:
      - name: kdc
        image: zookage-kdc
        ports:
        - name: kdc-tcp
          containerPort: 10088
          protocol: TCP
        - name: kdc-udp
          containerPort: 10088
          protocol: UDP
        readinessProbe:
          tcpSocket:
            port: kdc-tcp
        volumeMounts:
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: kerberos-conf
          mountPath: /etc/krb5kdc/kdc.conf
          subPath: kdc.conf
        - name: kerberos-conf
          mountPath: /etc/krb5kdc/service.keyfile
          subPath: service.keyfile
        - name: kerberos-conf
          mountPath: /etc/krb5kdc/.k5.ZOOKAGE.LOCAL
          subPath: .k5.ZOOKAGE.LOCAL
      volumes:
      - name: kerberos-conf
        configMap:
          name: kerberos-conf
