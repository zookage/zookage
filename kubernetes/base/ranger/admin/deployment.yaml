apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranger-admin
spec:
  replicas: 1
  selector:
    matchLabels: {}
  template:
    spec:
      initContainers:
      - name: wait-for-postgres
        image: zookage-util
        args:
        - wait-for-rollout
        - statefulset/postgres-database
      - name: create-ranger-database
        image: zookage-postgres
        command:
        - /bin/bash
        args:
        - -c
        - |
          set -euo pipefail

          postgres_url='postgresql://admin:admin@postgres-database-0.postgres-database:5432'
          if ! psql "${postgres_url}" -tc "SELECT 1 FROM pg_database WHERE datname = 'ranger'" | grep -q 1; then
            psql "${postgres_url}" -c 'CREATE DATABASE ranger'
          fi
      - name: setup-database
        image: zookage-ranger
        command:
        - /bin/bash
        args:
        - -c
        - |
          set -euo pipefail
          cp -R /etc/ranger/conf.template/. "${RANGER_CONF}"

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          pattern = re.compile(r"\$\{env\.([A-Za-z_][A-Za-z0-9_]*)(?::-([^}]*))?\}")

          def replace(match):
              return os.environ.get(match.group(1), match.group(2) or "")

          site = Path(os.environ["RANGER_CONF"]) / "ranger-admin-site.xml"
          site.write_text(pattern.sub(replace, site.read_text()))
          PY

          exec python3 "${RANGER_HOME}/ranger-admin/db_setup.py"
        envFrom:
        - configMapRef:
            name: ranger-env
        env:
        - name: RANGER_ADMIN_CONF
          value: $(RANGER_CONF)
        - name: RANGER_ADMIN_HOME
          value: $(RANGER_HOME)/ranger-admin
        volumeMounts:
        - name: ranger-conf-template
          mountPath: /etc/ranger/conf.template
        - name: ranger-conf
          mountPath: /etc/ranger/conf
      containers:
      - name: ranger-admin
        image: zookage-ranger
        command:
        - java
        args:
        - -Dservername=rangeradmin
        - -Dlogdir=/mnt/log
        - -Dcatalina.base=$(RANGER_HOME)/ranger-admin/ews
        - org.apache.ranger.server.tomcat.EmbeddedServer
        envFrom:
        - configMapRef:
            name: ranger-env
        env:
        - name: CLASSPATH
          # yamllint disable-line rule:line-length
          value: $(RANGER_CONF):$(RANGER_HOME)/ranger-admin/ews/webapp/WEB-INF/classes/conf.dist:$(RANGER_HOME)/lib/*:$(RANGER_HOME)/ranger-admin/ews/lib/*:$(RANGER_HOME)/ranger-admin/ews/webapp/WEB-INF/lib/*:$(RANGER_HOME)/ranger-admin/ews/ranger_jaas/*
        readinessProbe:
          tcpSocket:
            port: 6080
        volumeMounts:
        - name: hive-conf
          mountPath: /etc/hive/conf
        - name: ranger-conf
          mountPath: /etc/ranger/conf
        - name: mnt
          mountPath: /mnt
      terminationGracePeriodSeconds: 5
      volumes:
      - name: hive-conf
        configMap:
          name: hive-conf
      - name: ranger-conf
        emptyDir: {}
      - name: ranger-conf-template
        configMap:
          name: ranger-conf
      - name: mnt
        emptyDir: {}
