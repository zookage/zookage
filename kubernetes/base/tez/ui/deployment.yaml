apiVersion: apps/v1
kind: Deployment
metadata:
  name: tez-ui
spec:
  replicas: 1
  selector:
    matchLabels: {}
  template:
    spec:
      containers:
      - name: tez-ui
        image: tomcat:11.0.18-jdk21-temurin
        command:
        - /bin/sh
        - -ec
        args:
        - |
          mkdir -p /usr/local/tomcat/webapps/tez-ui
          cd /usr/local/tomcat/webapps/tez-ui
          jar xf /opt/tez/share/tez-ui.war
          test -f config/configs.js
          cp /etc/tez-ui-conf/configs.js config/configs.js
          if [ -f /etc/tez-ui-auth/web.xml ]; then
            mkdir -p WEB-INF META-INF
            cp /etc/tez-ui-auth/web.xml WEB-INF/web.xml
            cp /etc/tez-ui-auth/context.xml META-INF/context.xml
          fi
          exec /usr/local/tomcat/bin/catalina.sh run
        readinessProbe:
          tcpSocket:
            port: 8080
        volumeMounts:
        - name: tez-src
          mountPath: /opt/tez
          subPath: opt/tez
        - name: tez-ui-conf
          mountPath: /etc/tez-ui-conf
      volumes:
      - name: tez-src
        image:
          reference: zookage-tez
          pullPolicy: IfNotPresent
      - name: tez-ui-conf
        configMap:
          name: tez-ui-conf
