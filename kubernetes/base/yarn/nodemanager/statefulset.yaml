apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yarn-nodemanager
spec:
  selector:
    matchLabels: {}
  serviceName: yarn-nodemanager
  podManagementPolicy: Parallel
  replicas: 3
  template:
    spec:
      initContainers:
      - name: wait-for-resourcemanager
        image: zookage-util
        args:
        - wait-for-rollout
        - statefulset/yarn-resourcemanager
      containers:
      - name: nodemanager
        image: zookage-hadoop
        command:
        - $(HADOOP_HOME)/bin/yarn
        args:
        - nodemanager
        envFrom:
        - configMapRef:
            name: hadoop-env
        - configMapRef:
            name: java-env
        env:
        - name: HADOOP_CLASSPATH
          value: "/opt/tez/share/tez-aux-services.jar"
        readinessProbe:
          tcpSocket:
            port: 8041
        securityContext:
          runAsUser: 1012
          runAsGroup: 1010
        volumeMounts:
        - name: hadoop-conf
          mountPath: /etc/hadoop/conf
        - name: shared-files
          mountPath: /etc/zookage/shared
          readOnly: true
        - name: hadoop-secret
          mountPath: /etc/secrets/hadoop
        - name: yarn-container-executor-conf
          mountPath: /opt/hadoop/etc/hadoop/container-executor.cfg
          subPath: container-executor.cfg
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: yarn-secret
          mountPath: /etc/secrets/yarn
        - name: mnt
          mountPath: /mnt
        - name: tez-src
          mountPath: /opt/tez
          subPath: opt/tez
      terminationGracePeriodSeconds: 5
      volumes:
      - name: shared-files
        configMap:
          name: shared-files
      - name: hadoop-conf
        projected:
          sources:
          - configMap:
              name: hadoop-yarn-conf
          - configMap:
              name: hdfs-conf
          - configMap:
              name: yarn-conf
      - name: hadoop-secret
        secret:
          secretName: hadoop-secret
      - name: yarn-container-executor-conf
        configMap:
          name: yarn-container-executor-conf
          defaultMode: 0400
      - name: kerberos-conf
        configMap:
          name: kerberos-conf
      - name: yarn-secret
        secret:
          secretName: yarn-secret
          defaultMode: 0444
      - name: mnt
        emptyDir: {}
      - name: tez-src
        image:
          reference: zookage-tez
          pullPolicy: IfNotPresent
