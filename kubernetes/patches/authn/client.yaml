apiVersion: v1
kind: ConfigMap
metadata:
  name: client-config-values
data:
  hadoop_security_authentication: kerberos
  hadoop_rpc_protection: privacy
  hadoop_ipc_client_fallback_to_simple_auth_allowed: "true"
  hbase_security_authentication: kerberos
  hbase_security_authentication_ui: kerberos
  hbase_zookeeper_client_keytab_file: /etc/secrets/client/client.keytab
  hbase_zookeeper_client_kerberos_principal: zookage@ZOOKAGE.LOCAL
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: client-node
spec:
  template:
    spec:
      containers:
      - name: sleep
        env:
        - name: HBASE_OPTS
          value: -Djava.security.auth.login.config=/etc/zookeeper/conf/client-jaas.conf
        volumeMounts:
        - name: spark-jws-key
          mountPath: /etc/secrets/spark
          readOnly: true
      volumes:
      - name: spark-jws-key
        secret:
          secretName: spark-secret
          defaultMode: 0444
          items:
          - key: spark-jws.key
            path: spark-jws.key
