apiVersion: v1
kind: ConfigMap
metadata:
  name: client-config-values
data:
  hadoop_security_authentication: kerberos
  hadoop_rpc_protection: privacy
  hadoop_ipc_client_fallback_to_simple_auth_allowed: "true"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: client-node
spec:
  template:
    spec:
      containers:
      - name: sleep
        envFrom:
        - configMapRef:
            name: hadoop-env
        - configMapRef:
            name: hbase-env
        - configMapRef:
            name: hive-env
        - configMapRef:
            name: ozone-env
        - configMapRef:
            name: spark-env
        - configMapRef:
            name: tez-env
        - configMapRef:
            name: trino-env
        - configMapRef:
            name: zookeeper-env
        - secretRef:
            name: aws-secret-env
        - secretRef:
            name: spark-secret-env
