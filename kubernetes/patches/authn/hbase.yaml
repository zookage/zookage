apiVersion: v1
kind: ConfigMap
metadata:
  name: hbase-env
data:
  HBASE_SECURITY_AUTHENTICATION: kerberos
  HBASE_RPC_PROTECTION: authentication
  HBASE_MASTER_KERBEROS_PRINCIPAL: hbase/_HOST@ZOOKAGE.LOCAL
  HBASE_MASTER_KEYTAB_FILE: /etc/hbase/secrets/hbase.keytab
  HBASE_REGIONSERVER_KERBEROS_PRINCIPAL: hbase/_HOST@ZOOKAGE.LOCAL
  HBASE_REGIONSERVER_KEYTAB_FILE: /etc/hbase/secrets/hbase.keytab
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hbase-master
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kerberos-kdc
      containers:
      - name: master
        env:
        - name: HADOOP_SECURITY_AUTHENTICATION
          value: kerberos
        - name: HADOOP_RPC_PROTECTION
          value: authentication
        volumeMounts:
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: hbase-secret
          mountPath: /etc/hbase/secrets
      volumes:
      - name: kerberos-conf
        configMap:
          name: kerberos-conf
      - name: hbase-secret
        secret:
          secretName: hbase-secret
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hbase-regionserver
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kerberos-kdc
      containers:
      - name: regionserver
        env:
        - name: HADOOP_SECURITY_AUTHENTICATION
          value: kerberos
        - name: HADOOP_RPC_PROTECTION
          value: authentication
        volumeMounts:
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: hbase-secret
          mountPath: /etc/hbase/secrets
      volumes:
      - name: kerberos-conf
        configMap:
          name: kerberos-conf
      - name: hbase-secret
        secret:
          secretName: hbase-secret
