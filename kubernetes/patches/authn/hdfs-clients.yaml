apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hbase-master
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kerberos-kdc
      - name: wait-for-dns
        image: zookage-util
        args:
        - wait-for-dns
      containers:
      - name: master
        volumeMounts:
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: hbase-secret
          mountPath: /etc/hbase/secrets/hbase.keytab
          subPath: hbase.keytab
          readOnly: true
      volumes:
      - name: kerberos-conf
        configMap:
          name: kerberos-conf
      - name: hbase-secret
        secret:
          secretName: hbase-secret
          defaultMode: 0444
---
