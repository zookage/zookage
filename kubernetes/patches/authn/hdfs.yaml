apiVersion: v1
kind: ConfigMap
metadata:
  name: config-values
data:
  hadoop_security_authentication: kerberos
  hadoop_dfs_block_access_token_enable: "true"
  hadoop_dfs_data_transfer_protection: authentication
  hadoop_dfs_http_policy: HTTPS_ONLY
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hdfs-config-values
data:
  hadoop_http_authentication_type: kerberos
  hadoop_http_authentication_kerberos_principal: HTTP/_HOST@ZOOKAGE.LOCAL
  hadoop_http_authentication_kerberos_keytab: /etc/hdfs/secrets/hdfs.keytab
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hdfs-namenode
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kerberos-kdc
      - name: wait-for-dns
      containers:
      - name: namenode
        volumeMounts:
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: hdfs-secret
          mountPath: /etc/hdfs/secrets
          readOnly: true
      volumes:
      - name: kerberos-conf
        configMap:
          name: kerberos-conf
      - name: hdfs-secret
        secret:
          secretName: hdfs-secret
          defaultMode: 0444
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hdfs-datanode
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kerberos-kdc
      - name: wait-for-dns
        image: zookage-util
        args:
        - wait-for-dns
      containers:
      - name: datanode
        readinessProbe:
          tcpSocket:
            port: 9865
        volumeMounts:
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: hdfs-secret
          mountPath: /etc/hdfs/secrets
          readOnly: true
      volumes:
      - name: kerberos-conf
        configMap:
          name: kerberos-conf
      - name: hdfs-secret
        secret:
          secretName: hdfs-secret
          defaultMode: 0444
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hdfs-journalnode
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kerberos-kdc
      containers:
      - name: journalnode
        volumeMounts:
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: hdfs-secret
          mountPath: /etc/hdfs/secrets
          readOnly: true
      volumes:
      - name: kerberos-conf
        configMap:
          name: kerberos-conf
      - name: hdfs-secret
        secret:
          secretName: hdfs-secret
          defaultMode: 0444
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hdfs-httpfs
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kerberos-kdc
      containers:
      - name: httpfs
        volumeMounts:
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: hdfs-secret
          mountPath: /etc/hdfs/secrets
          readOnly: true
      volumes:
      - name: kerberos-conf
        configMap:
          name: kerberos-conf
      - name: hdfs-secret
        secret:
          secretName: hdfs-secret
          defaultMode: 0444
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hdfs-mkdir
spec:
  template:
    spec:
      containers:
      - name: mkdir
        volumeMounts:
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: hdfs-secret
          mountPath: /etc/hdfs/secrets
          readOnly: true
      volumes:
      - name: kerberos-conf
        configMap:
          name: kerberos-conf
      - name: hdfs-secret
        secret:
          secretName: hdfs-secret
---
apiVersion: v1
kind: Service
metadata:
  name: hdfs-namenode
spec:
  ports:
  - $patch: replace
  - name: https
    port: 9871
