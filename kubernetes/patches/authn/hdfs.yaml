            hdfs/$(POD_NAME).hdfs-datanode.zookage.svc.cluster.local@ZOOKAGE.LOCAL
        - name: HADOOP_DFS_WEB_AUTHENTICATION_KERBEROS_PRINCIPAL
          value: >-
            HTTP/$(POD_NAME).hdfs-datanode.zookage.svc.cluster.local@ZOOKAGE.LOCAL
        - name: HADOOP_SECURITY_AUTHENTICATION
