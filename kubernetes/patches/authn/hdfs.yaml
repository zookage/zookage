apiVersion: v1
kind: ConfigMap
metadata:
  name: hadoop-env
data:
  HADOOP_DFS_BLOCK_ACCESS_TOKEN_ENABLE: "true"
  HADOOP_DFS_DATA_TRANSFER_PROTECTION: authentication
  HADOOP_DFS_HTTP_POLICY: HTTPS_ONLY
  HADOOP_DFS_NAMENODE_KERBEROS_PRINCIPAL: hdfs/_HOST@ZOOKAGE.LOCAL
  HADOOP_DFS_NAMENODE_KEYTAB_FILE: /etc/hdfs/secrets/hdfs.keytab
  HADOOP_DFS_NAMENODE_KERBEROS_INTERNAL_SPNEGO_PRINCIPAL: >-
    HTTP/_HOST@ZOOKAGE.LOCAL
  HADOOP_DFS_DATANODE_KERBEROS_PRINCIPAL: hdfs/_HOST@ZOOKAGE.LOCAL
  HADOOP_DFS_DATANODE_KEYTAB_FILE: /etc/hdfs/secrets/hdfs.keytab
  HADOOP_DFS_JOURNALNODE_KERBEROS_PRINCIPAL: hdfs/_HOST@ZOOKAGE.LOCAL
  HADOOP_DFS_JOURNALNODE_KEYTAB_FILE: /etc/hdfs/secrets/hdfs.keytab
  HADOOP_DFS_JOURNALNODE_KERBEROS_INTERNAL_SPNEGO_PRINCIPAL: >-
    HTTP/_HOST@ZOOKAGE.LOCAL
  HADOOP_DFS_WEB_AUTHENTICATION_KERBEROS_PRINCIPAL: >-
    HTTP/_HOST@ZOOKAGE.LOCAL
  HADOOP_DFS_WEB_AUTHENTICATION_KERBEROS_KEYTAB: >-
    /etc/hdfs/secrets/hdfs.keytab
  HADOOP_HTTPFS_AUTHENTICATION_TYPE: kerberos
  HADOOP_HTTPFS_AUTHENTICATION_KERBEROS_PRINCIPAL: >-
    HTTP/hdfs-httpfs.zookage.svc.cluster.local@ZOOKAGE.LOCAL
  HADOOP_HTTPFS_AUTHENTICATION_KERBEROS_KEYTAB: >-
    /etc/hdfs/secrets/hdfs.keytab
  HADOOP_HTTPFS_HADOOP_AUTHENTICATION_TYPE: kerberos
  HADOOP_HTTPFS_HADOOP_AUTHENTICATION_KERBEROS_PRINCIPAL: >-
    httpfs/hdfs-httpfs.zookage.svc.cluster.local@ZOOKAGE.LOCAL
  HADOOP_HTTPFS_HADOOP_AUTHENTICATION_KERBEROS_KEYTAB: >-
    /etc/hdfs/secrets/hdfs.keytab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ranger-conf
data:
  ranger-service-hdfs.json: |
    {
      "type": "hdfs",
      "name": "hdfs",
      "configs": {
        "username": "hdfs",
        "password": "dummy",
        "fs.default.name": "hdfs://zookage",
        "hadoop.security.authentication": "kerberos",
        "hadoop.security.authorization": "true",
        "dfs.namenode.kerberos.principal": "hdfs/_HOST@ZOOKAGE.LOCAL",
        "policy.download.auth.users": "hdfs",
        "tag.download.auth.users": "hdfs"
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: hdfs-namenode
spec:
  ports:
  - $patch: replace
  - name: https
    port: 9871
---
apiVersion: v1
kind: Service
metadata:
  name: hdfs-datanode
spec:
  publishNotReadyAddresses: true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: client-node
spec:
  template:
    spec:
      containers:
      - name: sleep
        volumeMounts:
        - name: hdfs-secret
          mountPath: /etc/hdfs/secrets
      volumes:
      - name: hdfs-secret
        secret:
          secretName: hdfs-secret
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hdfs-namenode
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-dns
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kerberos-kdc
      - name: format
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: HADOOP_DFS_NAMENODE_KERBEROS_PRINCIPAL
          value: >-
            hdfs/$(POD_NAME).hdfs-namenode.zookage.svc.cluster.local@ZOOKAGE.LOCAL
        - name: HADOOP_DFS_NAMENODE_KERBEROS_INTERNAL_SPNEGO_PRINCIPAL
          value: >-
            HTTP/$(POD_NAME).hdfs-namenode.zookage.svc.cluster.local@ZOOKAGE.LOCAL
        - name: HADOOP_SECURITY_AUTHENTICATION
          value: kerberos
        - name: HADOOP_RPC_PROTECTION
          value: authentication
        volumeMounts:
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: hdfs-secret
          mountPath: /etc/hdfs/secrets
      containers:
      - name: namenode
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: HADOOP_DFS_NAMENODE_KERBEROS_PRINCIPAL
          value: >-
            hdfs/$(POD_NAME).hdfs-namenode.zookage.svc.cluster.local@ZOOKAGE.LOCAL
        - name: HADOOP_DFS_NAMENODE_KERBEROS_INTERNAL_SPNEGO_PRINCIPAL
          value: >-
            HTTP/$(POD_NAME).hdfs-namenode.zookage.svc.cluster.local@ZOOKAGE.LOCAL
        - name: HADOOP_DFS_WEB_AUTHENTICATION_KERBEROS_PRINCIPAL
          value: >-
            HTTP/$(POD_NAME).hdfs-namenode.zookage.svc.cluster.local@ZOOKAGE.LOCAL
        - name: HADOOP_SECURITY_AUTHENTICATION
          value: kerberos
        - name: HADOOP_RPC_PROTECTION
          value: authentication
        - name: HADOOP_HTTP_AUTHENTICATION_TYPE
          value: kerberos
        - name: HADOOP_HTTP_AUTHENTICATION_KERBEROS_PRINCIPAL
          value: >-
            HTTP/$(POD_NAME).hdfs-namenode.zookage.svc.cluster.local@ZOOKAGE.LOCAL
        - name: HADOOP_HTTP_AUTHENTICATION_KERBEROS_KEYTAB
          value: /etc/hdfs/secrets/hdfs.keytab
        volumeMounts:
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: hdfs-secret
          mountPath: /etc/hdfs/secrets
      volumes:
      - name: kerberos-conf
        configMap:
          name: kerberos-conf
      - name: hdfs-secret
        secret:
          secretName: hdfs-secret
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hdfs-datanode
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-dns
        image: zookage-util
        args:
        - wait-for-dns
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
