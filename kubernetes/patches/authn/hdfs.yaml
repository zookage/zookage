apiVersion: batch/v1
kind: Job
metadata:
  name: hdfs-mkdir
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kerberos-kdc
      containers:
      - name: mkdir
        args:
        - -c
        - |
          kinit -kt /etc/hdfs/secrets/hdfs.keytab hdfs@ZOOKAGE.LOCAL

          hdfs_mkdir() {
            "${HADOOP_HOME}/bin/hdfs" dfs -mkdir -p "$1"
            "${HADOOP_HOME}/bin/hdfs" dfs -chown "$2" "$1"
            "${HADOOP_HOME}/bin/hdfs" dfs -chmod "$3" "$1"
          }

          hdfs_mkdir /apps hdfs:supergroup 755
          hdfs_mkdir /apps/hbase hbase:hbase 711
          hdfs_mkdir /apps/hive-warehouse hive:hadoop 1770
          hdfs_mkdir /apps/mapred-history-intermediate mapred:mapred 1777
          hdfs_mkdir /apps/mapred-history mapred:mapred 750
          hdfs_mkdir /apps/spark-history spark:spark 1777
          hdfs_mkdir /lib hdfs:supergroup 755
          hdfs_mkdir /lib/tez tez:tez 755
          hdfs_mkdir /tmp hdfs:supergroup 1777
          hdfs_mkdir /tmp/hadoop-yarn yarn:hadoop 775
          hdfs_mkdir /tmp/hadoop-yarn/staging yarn:hadoop 1777
          hdfs_mkdir /user hdfs:supergroup 711
          hdfs_mkdir /user/hive hive:hive 700
          hdfs_mkdir /user/zookage zookage:zookage 700
        env:
        - name: HADOOP_SECURITY_AUTHENTICATION
          value: kerberos
        - name: HADOOP_RPC_PROTECTION
          value: authentication
        volumeMounts:
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: hdfs-secret
          mountPath: /etc/hdfs/secrets
      volumes:
      - name: kerberos-conf
        configMap:
          name: kerberos-conf
      - name: hdfs-secret
        secret:
          secretName: hdfs-secret
