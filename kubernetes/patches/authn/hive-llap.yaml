apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hive-llap
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kerberos-kdc
      - name: wait-for-zookeeper
        image: zookage-util
        args:
        - wait-for-rollout
        - statefulset/zookeeper-server
      containers:
      - name: llap
        volumeMounts:
        - name: hive-secret
          mountPath: /etc/secrets/hive
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: zookeeper-client-secret
          mountPath: /etc/secrets/zookeeper-client
      volumes:
      - name: hive-secret
        secret:
          secretName: hive-secret
          defaultMode: 0444
      - name: kerberos-conf
        configMap:
          name: kerberos-conf
      - name: zookeeper-client-secret
        secret:
          secretName: zookeeper-client-secret
