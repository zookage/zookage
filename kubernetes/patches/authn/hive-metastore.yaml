apiVersion: v1
kind: ConfigMap
metadata:
  name: config-values
data:
  hive_metastore_catalog_servlet_auth: oauth2
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hive-metastore-server
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-keycloak
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/keycloak-server
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kerberos-kdc
      - name: wait-for-postgres
      - name: create-hive-database
      - name: wait-for-warehouse-dir
      - name: init-schema
        env:
        - name: KRB5PRINCIPAL
          value: hive/hive-metastore-server.zookage.svc.cluster.local@ZOOKAGE.LOCAL
        - name: KRB5KEYTAB
          value: /etc/hive/secrets/hive.keytab
        volumeMounts:
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: hive-secret
          mountPath: /etc/hive/secrets/hive.keytab
          subPath: hive.keytab
          readOnly: true
      containers:
      - name: metastore
        env:
        - name: KRB5PRINCIPAL
          value: hive/hive-metastore-server.zookage.svc.cluster.local@ZOOKAGE.LOCAL
        - name: KRB5KEYTAB
          value: /etc/hive/secrets/hive.keytab
        volumeMounts:
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: hive-secret
          mountPath: /etc/hive/secrets/hive.keytab
          subPath: hive.keytab
          readOnly: true
      volumes:
      - name: kerberos-conf
        configMap:
          name: kerberos-conf
      - name: hive-secret
        secret:
          secretName: hive-secret
          defaultMode: 0444
