apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yarn-nodemanager
spec:
  template:
    spec:
      containers:
      - name: nodemanager
        volumeMounts:
        - name: hive-tez-am-secret
          mountPath: /etc/secrets/hive-tez-am
      volumes:
      - name: hive-tez-am-secret
        secret:
          secretName: hive-tez-am-secret
          defaultMode: 0444
