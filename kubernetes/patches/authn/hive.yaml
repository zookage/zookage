apiVersion: v1
kind: ConfigMap
metadata:
  name: hive-env
data:
  HIVE_METASTORE_SASL_ENABLED: "true"
  HIVE_METASTORE_KERBEROS_PRINCIPAL: >-
    hive/hive-metastore-server-0.hive-metastore-server.zookage.svc.cluster.local@ZOOKAGE.LOCAL
  HIVE_METASTORE_CLIENT_KERBEROS_PRINCIPAL: >-
    hive/hive-metastore-server-0.hive-metastore-server.zookage.svc.cluster.local@ZOOKAGE.LOCAL
  HIVE_SERVER2_AUTHENTICATION: KERBEROS
  HIVE_SERVER2_KERBEROS_PRINCIPAL: >-
    hive/hive-hiveserver2.zookage.svc.cluster.local@ZOOKAGE.LOCAL
  HIVE_SERVER2_CLIENT_KERBEROS_PRINCIPAL: >-
    hive/hive-hiveserver2.zookage.svc.cluster.local@ZOOKAGE.LOCAL
  HIVE_SERVER2_KERBEROS_KEYTAB: /etc/hive/secrets/hive.keytab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-hiveserver2
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kerberos-kdc
      containers:
      - name: hiveserver2
        env:
        - name: HADOOP_SECURITY_AUTHENTICATION
          value: kerberos
        - name: HADOOP_RPC_PROTECTION
          value: authentication
        volumeMounts:
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: hive-secret
          mountPath: /etc/hive/secrets
      volumes:
      - name: kerberos-conf
        configMap:
          name: kerberos-conf
      - name: hive-secret
        secret:
          secretName: hive-secret
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hive-metastore-server
spec:
  template:
    spec:
      containers:
      - name: metastore
        readinessProbe:
          $patch: replace
          exec:
            command:
            - /bin/sh
            - -c
            - kill -0 1
