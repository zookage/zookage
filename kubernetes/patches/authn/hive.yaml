apiVersion: v1
kind: ConfigMap
metadata:
  name: config-values
data:
  hadoop_client_security_authentication: kerberos
  hadoop_client_rpc_protection: authentication
  hadoop_client_ipc_client_fallback_to_simple_auth_allowed: "true"
  hive_server2_kerberos_principal: hive/hive-hiveserver2.zookage.svc.cluster.local@ZOOKAGE.LOCAL
  hive_server2_kerberos_keytab: /etc/hive/secrets/hive.keytab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ranger-conf
data:
  ranger-service-hive.json: |
    {
      "type": "hive",
      "name": "hive",
      "configs": {
        "username": "hive",
        "password": "dummy",
        "jdbc.driverClassName": "dummy",
        "jdbc.url": "dummy",
        "enable.hive.metastore.lookup": "true",
        "hive.site.file.path": "/etc/hive/conf/hive-site.xml",
        "policy.download.auth.users": "hive",
        "tag.download.auth.users": "hive"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-hiveserver2
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kerberos-kdc
      - name: initialize-hive-keytab
        image: zookage-hadoop
        command:
        - /bin/bash
        - -euc
        args:
        - |
          install -d -o 1020 -g 1020 -m 0700 /etc/hive/secrets
          install -o 1020 -g 1020 -m 0400 \
            /etc/hive/keytab-source/hive.keytab /etc/hive/secrets/hive.keytab
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
        - name: hive-keytab-source
          mountPath: /etc/hive/keytab-source
          readOnly: true
        - name: hive-secret
          mountPath: /etc/hive/secrets
      containers:
      - name: hiveserver2
        volumeMounts:
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: hive-secret
          mountPath: /etc/hive/secrets
          readOnly: true
      volumes:
      - name: hadoop-conf
        projected:
          sources:
          - configMap:
              name: hadoop-conf
              items:
              - key: core-site-client.xml
                path: core-site.xml
              - key: core-site-common.xml
                path: core-site-common.xml
              - key: hadoop-metrics2.properties
                path: hadoop-metrics2.properties
              - key: log4j.properties
                path: log4j.properties
          - configMap:
              name: hdfs-conf
          - configMap:
              name: mapreduce-conf
          - configMap:
              name: yarn-conf
      - name: kerberos-conf
        configMap:
          name: kerberos-conf
      - name: hive-secret
        emptyDir: {}
      - name: hive-keytab-source
        secret:
          secretName: hive-secret
          defaultMode: 0400
