apiVersion: v1
kind: ConfigMap
metadata:
  name: hadoop-env
data:
  HADOOP_MAPRED_JOBHISTORY_PRINCIPAL: >-
    mapred/mapreduce-historyserver-0.mapreduce-historyserver.zookage.svc.cluster.local@ZOOKAGE.LOCAL
  HADOOP_MAPRED_JOBHISTORY_KEYTAB: /etc/mapreduce/secrets/mapreduce.keytab
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mapreduce-historyserver
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kerberos-kdc
      containers:
      - name: historyserver
        env:
        - name: HADOOP_SECURITY_AUTHENTICATION
          value: kerberos
        - name: HADOOP_RPC_PROTECTION
          value: authentication
        volumeMounts:
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: mapreduce-secret
          mountPath: /etc/mapreduce/secrets
      volumes:
      - name: kerberos-conf
        configMap:
          name: kerberos-conf
      - name: mapreduce-secret
        secret:
          secretName: mapreduce-secret
