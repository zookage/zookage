apiVersion: v1
kind: ConfigMap
metadata:
  name: mapreduce-config-values
data:
  hadoop_http_filter_initializers: org.apache.hadoop.security.AuthenticationFilterInitializer
  hadoop_http_authentication_type: kerberos
  hadoop_http_authentication_kerberos_principal: >-
    HTTP/mapreduce-historyserver-0.mapreduce-historyserver.zookage.svc.cluster.local@ZOOKAGE.LOCAL
  hadoop_http_authentication_kerberos_keytab: /etc/mapreduce/secrets/mapreduce.keytab
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mapreduce-historyserver
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kerberos-kdc
