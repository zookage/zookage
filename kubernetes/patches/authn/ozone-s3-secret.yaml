apiVersion: batch/v1
kind: Job
metadata:
  name: ozone-s3-secret
  labels:
    tier: job
spec:
  template:
    metadata:
      labels:
        tier: job
    spec:
      initContainers:
      - name: wait-for-om
        image: zookage-util
        args:
        - wait-for-rollout
        - statefulset/ozone-om
      containers:
      - name: set-secret
        image: zookage-util
        command:
        - /bin/bash
        args:
        - -c
        - |
          set -euo pipefail

          # Provision the shared access ID without granting zookage admin rights.
          kinit -kt /etc/secrets/ozone/ozone.keytab \
            ozone/ozone-om-0.ozone-om.zookage.svc.cluster.local@ZOOKAGE.LOCAL
          if output=$(/opt/ozone/bin/ozone s3 getsecret -u zookage 2>&1); then
            :
          elif [[ "${output}" == *"Secret for 'zookage' already exists"* ]]; then
            :
          else
            printf '%s\n' "${output}" >&2
            exit 1
          fi

          /opt/ozone/bin/ozone s3 setsecret -u zookage \
            --secret "${AWS_SECRET_ACCESS_KEY}" > /dev/null
        envFrom:
        - configMapRef:
            name: ozone-env
        - secretRef:
            name: aws-secret
        volumeMounts:
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: ozone-secret
          mountPath: /etc/secrets/ozone
        - name: ozone-conf
          mountPath: /etc/ozone/conf
        - name: ozone-src
          mountPath: /opt/ozone
          subPath: opt/ozone
      restartPolicy: Never
      volumes:
      - name: kerberos-conf
        configMap:
          name: kerberos-conf
      - name: ozone-secret
        secret:
          secretName: ozone-secret
          items:
          - key: ozone.keytab
            path: ozone.keytab
      - name: ozone-conf
        projected:
          sources:
          - configMap:
              name: ozone-conf
          - configMap:
              name: hadoop-client-conf
              items:
              - key: core-site.xml
                path: core-site.xml
      - name: ozone-src
        image:
          reference: zookage-ozone
          pullPolicy: IfNotPresent
