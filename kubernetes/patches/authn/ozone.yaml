apiVersion: v1
kind: ConfigMap
metadata:
  name: config-values
data:
  ozone_security_enabled: "true"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ozone-scm
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kerberos-kdc
      - name: wait-for-dns
        image: zookage-util
        args:
        - wait-for-dns
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ozone-om
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-scm
      - name: wait-for-dns
        image: zookage-util
        args:
        - wait-for-dns
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ozone-datanode
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-dns
        image: zookage-util
        args:
        - wait-for-dns
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ozone-recon
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-dns
        image: zookage-util
        args:
        - wait-for-dns
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: client-node
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-ozone-setup
        image: zookage-util
        args:
        - wait-for-job
        - ozone-setup
