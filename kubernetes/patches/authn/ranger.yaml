apiVersion: v1
kind: ConfigMap
metadata:
  name: ranger-conf
data:
  ranger-admin-site.xml: |-
    <!--
      ~ Licensed under the Apache License, Version 2.0 (the "License");
      ~ you may not use this file except in compliance with the License.
      ~ You may obtain a copy of the License at
      ~
      ~     http://www.apache.org/licenses/LICENSE-2.0
      ~
      ~ Unless required by applicable law or agreed to in writing, software
      ~ distributed under the License is distributed on an "AS IS" BASIS,
      ~ WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
      ~ See the License for the specific language governing permissions and
      ~ limitations under the License.
    -->

    <configuration>
      <property>
        <name>ranger.jpa.jdbc.url</name>
        <value>jdbc:postgresql://postgres-database-0.postgres-database:5432/ranger</value>
      </property>
      <property>
        <name>ranger.jpa.jdbc.user</name>
        <value>admin</value>
      </property>
      <property>
        <name>ranger.jpa.jdbc.password</name>
        <value>admin</value>
      </property>
      <property>
        <name>ranger.jpa.jdbc.dialect</name>
        <value>org.eclipse.persistence.platform.database.PostgreSQLPlatform</value>
      </property>
      <property>
        <name>ranger.jpa.audit.jdbc.dialect</name>
        <value>org.eclipse.persistence.platform.database.PostgreSQLPlatform</value>
      </property>
      <property>
        <name>ranger.jpa.jdbc.driver</name>
        <value>org.postgresql.Driver</value>
      </property>
      <property>
        <name>ranger.jpa.audit.jdbc.driver</name>
        <value>org.postgresql.Driver</value>
      </property>
      <property>
        <name>ranger.mail.enabled</name>
        <value>false</value>
      </property>
      <property>
        <name>ranger.service.host</name>
        <value>ranger-admin</value>
      </property>
      <property>
        <name>ranger.externalurl</name>
        <value>ranger-admin</value>
      </property>
      <property>
        <name>ranger.service.http.port</name>
        <value>6080</value>
      </property>
      <property>
        <name>ranger.admin.cookie.name</name>
        <value>RANGERADMINSESSIONID</value>
      </property>
      <property>
        <name>ranger.authentication.method</name>
        <value>NONE</value>
      </property>
      <property>
        <name>hadoop.security.authentication</name>
        <value>kerberos</value>
      </property>
      <property>
        <name>ranger.admin.kerberos.principal</name>
        <value>rangeradmin/ranger-admin@ZOOKAGE.LOCAL</value>
      </property>
      <property>
        <name>ranger.admin.kerberos.keytab</name>
        <value>/etc/security/keytabs/ranger.keytab</value>
      </property>
      <property>
        <name>ranger.spnego.kerberos.principal</name>
        <value>HTTP/ranger-admin.zookage.svc.cluster.local@ZOOKAGE.LOCAL</value>
      </property>
      <property>
        <name>ranger.spnego.kerberos.keytab</name>
        <value>/etc/security/keytabs/ranger.keytab</value>
      </property>
      <property>
        <name>ranger.lookup.kerberos.principal</name>
        <value>rangerlookup/ranger-admin.zookage.svc.cluster.local@ZOOKAGE.LOCAL</value>
      </property>
      <property>
        <name>ranger.lookup.kerberos.keytab</name>
        <value>/etc/security/keytabs/ranger.keytab</value>
      </property>
      <property>
        <name>ranger.allow.kerberos.auth.login.browser</name>
        <value>true</value>
      </property>
      <property>
        <name>ranger.admin.allow.unauthenticated.download.access</name>
        <value>true</value>
      </property>
      <property>
        <name>ranger.tomcat.work.dir</name>
        <value>/mnt</value>
      </property>
      <property>
        <name>ranger.service.store.create.embedded.service-defs</name>
        <value>true</value>
      </property>
    </configuration>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranger-admin
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kdc-server
      - name: wait-for-postgres
      - name: create-ranger-database
      - name: setup-database
        volumeMounts:
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: kerberos-keytabs
          mountPath: /etc/security/keytabs
          readOnly: true
      containers:
      - name: ranger-admin
        volumeMounts:
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: kerberos-keytabs
          mountPath: /etc/security/keytabs
          readOnly: true
      volumes:
      - name: kerberos-conf
        configMap:
          name: kerberos-conf
      - name: kerberos-keytabs
        secret:
          secretName: kerberos-keytabs
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ranger-policies
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kdc-server
      containers:
      - name: create-policies
        args:
        - -c
        - |
          set -euo pipefail
          export KRB5CCNAME=/tmp/ranger-policies.ccache
          kinit -kt /etc/security/keytabs/ranger.keytab admin/admin@ZOOKAGE.LOCAL

          ranger_curl() {
            curl --fail --negotiate -u : "$@"
          }

          for conf in /etc/ranger/conf/ranger-service-*.json; do
            echo "Applying $conf"
            ranger_curl \
             -X POST \
             -H "Content-Type: application/json" \
             -d @"$conf" \
             "http://ranger-admin:6080/service/public/v2/api/service"
          done

          until ranger_curl \
            "http://ranger-admin:6080/service/public/v2/api/roles/user/zookage"; do
            sleep 1
          done
          for conf in /etc//ranger/conf/ranger-role-*.json; do
            echo "Applying $conf"
            ranger_curl \
             -X POST \
             -H "Content-Type: application/json" \
             -d @"$conf" \
             "http://ranger-admin:6080/service/public/v2/api/roles"
          done

          echo "Applying policies"
          ranger_curl \
           -X POST \
           -H "Content-Type: multipart/form-data" \
           -F "file=@/etc//ranger/conf/ranger-policies.json" \
           "http://ranger-admin:6080/service/plugins/policies/importPoliciesFromFile?isOverride=true"
        volumeMounts:
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: kerberos-keytabs
          mountPath: /etc/security/keytabs
          readOnly: true
      volumes:
      - name: kerberos-conf
        configMap:
          name: kerberos-conf
      - name: kerberos-keytabs
        secret:
          secretName: kerberos-keytabs
