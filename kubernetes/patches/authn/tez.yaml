apiVersion: v1
kind: ConfigMap
metadata:
  name: config-values
data:
  tez_ui_history_url_base: http://tez-ui.zookage.svc.cluster.local:9999/tez-ui/
---
apiVersion: batch/v1
kind: Job
metadata:
  name: tez-deploy
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kerberos-kdc
      containers:
      - name: upload
        env:
        - name: KRB5PRINCIPAL
          value: tez/tez-deploy@ZOOKAGE.LOCAL
        - name: KRB5KEYTAB
          value: /etc/secrets/tez/tez.keytab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tez-ui
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kerberos-kdc
      containers:
      - name: tez-ui
        args:
        - |
          mkdir -p /usr/local/tomcat/webapps/tez-ui
          cd /usr/local/tomcat/webapps/tez-ui
          jar xf /opt/tez/share/tez-ui.war
          test -f config/configs.js
          printf '\n%s\n' \
            'ENV.hosts.timeline = "http://yarn-timelineserver-0.yarn-timelineserver.zookage.svc.cluster.local:8188";' \
            'ENV.hosts.rm = "http://yarn-resourcemanager-0.yarn-resourcemanager.zookage.svc.cluster.local:8088";' \
            >> config/configs.js
          mkdir -p WEB-INF META-INF
          cp /etc/tez-ui-auth/web.xml WEB-INF/web.xml
          cp /etc/tez-ui-auth/context.xml META-INF/context.xml
          exec /usr/local/tomcat/bin/catalina.sh run
        env:
        - name: CATALINA_OPTS
          value: >-
            -Djava.security.auth.login.config=/etc/tez-ui-auth/jaas.conf
            -Djava.security.krb5.conf=/etc/krb5.conf
        volumeMounts:
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: tez-secret
          mountPath: /etc/secrets/tez
        - name: tez-ui-auth-conf
          mountPath: /etc/tez-ui-auth
      volumes:
      - name: kerberos-conf
        configMap:
          name: kerberos-conf
      - name: tez-secret
        secret:
          secretName: tez-secret
          defaultMode: 0444
      - name: tez-ui-auth-conf
        configMap:
          name: tez-ui-auth-conf
