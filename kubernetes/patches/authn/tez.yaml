apiVersion: batch/v1
kind: Job
metadata:
  name: tez-deploy
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kerberos-kdc
      containers:
      - name: upload
        env:
        - name: KRB5PRINCIPAL
          value: tez/tez-deploy@ZOOKAGE.LOCAL
        - name: KRB5KEYTAB
          value: /etc/tez/secrets/tez.keytab
