apiVersion: batch/v1
kind: Job
metadata:
  name: tez-deploy
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kerberos-kdc
      containers:
      - name: upload
        env:
        - name: KRB5PRINCIPAL
          value: tez/tez-deploy@ZOOKAGE.LOCAL
        - name: KRB5KEYTAB
          value: /etc/secrets/tez/tez.keytab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tez-ui
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kerberos-kdc
      containers:
      - name: tez-ui
        env:
        - name: CATALINA_OPTS
          value: >-
            -Djava.security.auth.login.config=/etc/tez-ui-auth/jaas.conf
            -Djava.security.krb5.conf=/etc/krb5.conf
        volumeMounts:
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: tez-secret
          mountPath: /etc/secrets/tez
        - name: tez-ui-auth-conf
          mountPath: /etc/tez-ui-auth
      volumes:
      - name: kerberos-conf
        configMap:
          name: kerberos-conf
      - name: tez-secret
        secret:
          secretName: tez-secret
          defaultMode: 0444
      - name: tez-ui-auth-conf
        configMap:
          name: tez-ui-auth-conf
