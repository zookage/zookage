apiVersion: v1
kind: ConfigMap
metadata:
  name: config-values
data:
  hadoop_yarn_nodemanager_principal: yarn/_HOST@ZOOKAGE.LOCAL
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hadoop-env
data:
  HADOOP_YARN_RESOURCEMANAGER_PRINCIPAL: yarn/_HOST@ZOOKAGE.LOCAL
  HADOOP_YARN_RESOURCEMANAGER_KEYTAB: /etc/yarn/secrets/yarn.keytab
  HADOOP_YARN_RESOURCEMANAGER_WEBAPP_SPNEGO_PRINCIPAL: >-
    HTTP/_HOST@ZOOKAGE.LOCAL
  HADOOP_YARN_RESOURCEMANAGER_WEBAPP_SPNEGO_KEYTAB_FILE: >-
    /etc/yarn/secrets/yarn.keytab
  HADOOP_YARN_NODEMANAGER_KEYTAB: /etc/yarn/secrets/yarn.keytab
  HADOOP_YARN_NODEMANAGER_WEBAPP_SPNEGO_PRINCIPAL: >-
    HTTP/_HOST@ZOOKAGE.LOCAL
  HADOOP_YARN_NODEMANAGER_WEBAPP_SPNEGO_KEYTAB_FILE: >-
    /etc/yarn/secrets/yarn.keytab
  HADOOP_YARN_NODEMANAGER_CONTAINER_EXECUTOR_CLASS: >-
    org.apache.hadoop.yarn.server.nodemanager.LinuxContainerExecutor
  HADOOP_YARN_NODEMANAGER_LINUX_CONTAINER_EXECUTOR_GROUP: yarn-executor
  HADOOP_YARN_TIMELINE_SERVICE_PRINCIPAL: >-
    yarn/yarn-timelineserver-0.yarn-timelineserver.zookage.svc.cluster.local@ZOOKAGE.LOCAL
  HADOOP_YARN_TIMELINE_SERVICE_KEYTAB: /etc/yarn/secrets/yarn.keytab
  HADOOP_YARN_TIMELINE_SERVICE_HTTP_AUTHENTICATION_TYPE: kerberos
  HADOOP_YARN_TIMELINE_SERVICE_HTTP_AUTHENTICATION_KERBEROS_PRINCIPAL: >-
    HTTP/yarn-timelineserver-0.yarn-timelineserver.zookage.svc.cluster.local@ZOOKAGE.LOCAL
  HADOOP_YARN_TIMELINE_SERVICE_HTTP_AUTHENTICATION_KERBEROS_KEYTAB: >-
    /etc/yarn/secrets/yarn.keytab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ranger-conf
data:
  ranger-service-yarn.json: |
    {
      "type": "yarn",
      "name": "yarn",
      "configs": {
        "username": "yarn",
        "password": "dummy",
        "yarn.url": "http://yarn-resourcemanager:8088",
        "policy.download.auth.users": "yarn",
        "tag.download.auth.users": "yarn",
        "ranger.add-yarn-authorization": "false"
      }
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yarn-resourcemanager
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kerberos-kdc
      - name: initialize-yarn-keytab
        image: zookage-hadoop
        command:
        - /bin/bash
        - -euc
        args:
        - |
          install -d -o 1012 -g 1012 -m 0700 /etc/yarn/secrets
          install -o 1012 -g 1012 -m 0400 \
            /etc/yarn/keytab-source/yarn.keytab /etc/yarn/secrets/yarn.keytab
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
        - name: yarn-keytab-source
          mountPath: /etc/yarn/keytab-source
          readOnly: true
        - name: yarn-secret
          mountPath: /etc/yarn/secrets
      containers:
      - name: resourcemanager
        env:
        - name: HADOOP_SECURITY_AUTHORIZATION
          value: "false"
        - name: HADOOP_SECURITY_AUTHENTICATION
          value: kerberos
        - name: HADOOP_RPC_PROTECTION
          value: authentication
        volumeMounts:
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: yarn-secret
          mountPath: /etc/yarn/secrets
          readOnly: true
      volumes:
      - name: kerberos-conf
        configMap:
          name: kerberos-conf
      - name: yarn-secret
        emptyDir: {}
      - name: yarn-keytab-source
        secret:
          secretName: yarn-secret
          defaultMode: 0400
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yarn-nodemanager
spec:
  template:
    spec:
      securityContext:
        supplementalGroups:
        - 1015
      initContainers:
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kerberos-kdc
      - name: initialize-yarn-keytab
        image: zookage-hadoop
        command:
        - /bin/bash
        - -euc
        args:
        - |
          install -d -o 1012 -g 1012 -m 0700 /etc/yarn/secrets
          install -o 1012 -g 1012 -m 0400 \
            /etc/yarn/keytab-source/yarn.keytab /etc/yarn/secrets/yarn.keytab
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
        - name: yarn-keytab-source
          mountPath: /etc/yarn/keytab-source
          readOnly: true
        - name: yarn-secret
          mountPath: /etc/yarn/secrets
      - name: initialize-sssd
        image: zookage-hadoop
        command:
        - /bin/bash
        - -euc
        args:
        - |
          install -d -o 0 -g 0 -m 0755 /var/lib/sss/pipes
          install -d -o 0 -g 0 -m 0700 /var/lib/sss/pipes/private
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
        - name: sssd-pipes
          mountPath: /var/lib/sss/pipes
      containers:
      - name: nodemanager
        command:
        - /bin/bash
        - -c
        args:
        - |
          until getent passwd zookage > /dev/null; do
            sleep 1
          done
          exec "${HADOOP_HOME}/bin/yarn" nodemanager
        env:
        - name: HADOOP_SECURITY_AUTHORIZATION
          value: "false"
        - name: HADOOP_SECURITY_AUTHENTICATION
          value: kerberos
        - name: HADOOP_RPC_PROTECTION
          value: authentication
        - name: HADOOP_IPC_CLIENT_FALLBACK_TO_SIMPLE_AUTH_ALLOWED
          value: "true"
        - name: JAVA_TOOL_OPTIONS
          value: --add-opens=java.base/java.lang=ALL-UNNAMED
        - name: YARN_NODEMANAGER_OPTS
          # yamllint disable-line rule:line-length
          value: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
        securityContext:
          allowPrivilegeEscalation: true
        volumeMounts:
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: yarn-secret
          mountPath: /etc/yarn/secrets
          readOnly: true
        - name: sssd-pipes
          mountPath: /var/lib/sss/pipes
          readOnly: true
      - name: sssd
        image: zookage-hadoop
        command:
        - /usr/sbin/sssd
        args:
        - --interactive
        - --logger=stderr
        readinessProbe:
          exec:
            command:
            - getent
            - passwd
            - zookage
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
        - name: sssd-conf
          mountPath: /etc/sssd/sssd.conf
          subPath: sssd.conf
        - name: sssd-pipes
          mountPath: /var/lib/sss/pipes
      volumes:
      - name: kerberos-conf
        configMap:
          name: kerberos-conf
      - name: yarn-secret
        emptyDir: {}
      - name: yarn-keytab-source
        secret:
          secretName: yarn-secret
          defaultMode: 0400
      - name: sssd-conf
        configMap:
          name: sssd-conf
          defaultMode: 0600
      - name: sssd-pipes
        emptyDir: {}
---
