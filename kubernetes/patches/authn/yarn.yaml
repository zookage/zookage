      containers:
      - name: timelineserver
        env:
        - name: HADOOP_SECURITY_AUTHORIZATION
          value: "false"
        - name: HADOOP_SECURITY_AUTHENTICATION
          value: kerberos
        - name: HADOOP_RPC_PROTECTION
          value: authentication
        volumeMounts:
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
