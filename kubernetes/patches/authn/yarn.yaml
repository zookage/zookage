apiVersion: v1
kind: ConfigMap
metadata:
  name: hadoop-env
data:
  HADOOP_YARN_RESOURCEMANAGER_PRINCIPAL: >-
    yarn/yarn-resourcemanager-0.yarn-resourcemanager.zookage.svc.cluster.local@ZOOKAGE.LOCAL
  HADOOP_YARN_RESOURCEMANAGER_KEYTAB: /etc/security/keytabs/yarn.keytab
  HADOOP_YARN_RESOURCEMANAGER_WEBAPP_SPNEGO_PRINCIPAL: >-
    HTTP/yarn-resourcemanager-0.yarn-resourcemanager.zookage.svc.cluster.local@ZOOKAGE.LOCAL
  HADOOP_YARN_RESOURCEMANAGER_WEBAPP_SPNEGO_KEYTAB_FILE: /etc/security/keytabs/yarn.keytab
  HADOOP_YARN_NODEMANAGER_PRINCIPAL: yarn/_HOST@ZOOKAGE.LOCAL
  HADOOP_YARN_NODEMANAGER_KEYTAB: /etc/security/keytabs/yarn.keytab
  HADOOP_YARN_NODEMANAGER_WEBAPP_SPNEGO_PRINCIPAL: HTTP/_HOST@ZOOKAGE.LOCAL
  HADOOP_YARN_NODEMANAGER_WEBAPP_SPNEGO_KEYTAB_FILE: /etc/security/keytabs/yarn.keytab
  HADOOP_YARN_TIMELINE_SERVICE_PRINCIPAL: >-
    yarn/yarn-timelineserver-0.yarn-timelineserver.zookage.svc.cluster.local@ZOOKAGE.LOCAL
  HADOOP_YARN_TIMELINE_SERVICE_KEYTAB: /etc/security/keytabs/yarn.keytab
  HADOOP_YARN_TIMELINE_SERVICE_HTTP_AUTHENTICATION_TYPE: kerberos
  HADOOP_YARN_TIMELINE_SERVICE_HTTP_AUTHENTICATION_KERBEROS_PRINCIPAL: >-
    HTTP/yarn-timelineserver-0.yarn-timelineserver.zookage.svc.cluster.local@ZOOKAGE.LOCAL
  HADOOP_YARN_TIMELINE_SERVICE_HTTP_AUTHENTICATION_KERBEROS_KEYTAB: /etc/security/keytabs/yarn.keytab
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yarn-resourcemanager
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kdc-server
      containers:
      - name: resourcemanager
        env:
        - name: HADOOP_SECURITY_AUTHORIZATION
          value: "false"
        - name: HADOOP_SECURITY_AUTHENTICATION
          value: kerberos
        - name: HADOOP_RPC_PROTECTION
          value: authentication
        volumeMounts:
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: kerberos-keytabs
          mountPath: /etc/security/keytabs
          readOnly: true
      volumes:
      - name: kerberos-conf
        configMap:
          name: kerberos-conf
      - name: kerberos-keytabs
        secret:
          secretName: kerberos-keytabs
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yarn-nodemanager
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kdc-server
      containers:
      - name: nodemanager
        env:
        - name: HADOOP_SECURITY_AUTHORIZATION
          value: "false"
        - name: HADOOP_SECURITY_AUTHENTICATION
          value: kerberos
        - name: HADOOP_RPC_PROTECTION
          value: authentication
        volumeMounts:
        - name: kerberos-conf
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
        - name: kerberos-keytabs
          mountPath: /etc/security/keytabs
          readOnly: true
      volumes:
      - name: kerberos-conf
        configMap:
          name: kerberos-conf
      - name: kerberos-keytabs
        secret:
          secretName: kerberos-keytabs
---
