apiVersion: v1
kind: ConfigMap
metadata:
  name: yarn-config-values
data:
  hadoop_security_authentication: kerberos
  hadoop_rpc_protection: privacy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-values
data:
  hadoop_yarn_nodemanager_container_executor_class: >-
    org.apache.hadoop.yarn.server.nodemanager.LinuxContainerExecutor
  hadoop_yarn_timeline_service_http_authentication_type: kerberos
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yarn-resourcemanager
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kerberos-kdc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yarn-nodemanager
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kerberos-kdc
      - name: initialize-sssd
        image: zookage-hadoop
        command:
        - /bin/bash
        - -euc
        args:
        - |
          install -d -o 0 -g 0 -m 0755 /var/lib/sss/pipes
          install -d -o 0 -g 0 -m 0700 /var/lib/sss/pipes/private
          install -o 0 -g 0 -m 0600 /source/sssd/sssd.conf /staged/sssd.conf
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
        - name: sssd-pipes
          mountPath: /var/lib/sss/pipes
        - name: sssd-conf
          mountPath: /source/sssd
          readOnly: true
        - name: sssd-conf-staged
          mountPath: /staged
      containers:
      - name: nodemanager
        command:
        - /bin/bash
        - -c
        args:
        - |
          until getent passwd zookage > /dev/null; do
            sleep 1
          done
          exec "${HADOOP_HOME}/bin/yarn" nodemanager \
            -D hadoop.security.credential.provider.path=localjceks://file/run/secrets/zookage/hadoop/hadoop.jceks
        env:
        - name: JAVA_TOOL_OPTIONS
          value: --add-opens=java.base/java.lang=ALL-UNNAMED
        - name: YARN_NODEMANAGER_OPTS
          # yamllint disable-line rule:line-length
          value: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
        securityContext:
          allowPrivilegeEscalation: true
        volumeMounts:
        - name: sssd-pipes
          mountPath: /var/lib/sss/pipes
          readOnly: true
      - name: sssd
        image: zookage-hadoop
        command:
        - /usr/sbin/sssd
        args:
        - --interactive
        - --logger=stderr
        readinessProbe:
          exec:
            command:
            - getent
            - passwd
            - zookage
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
        - name: sssd-conf-staged
          mountPath: /etc/sssd/sssd.conf
          subPath: sssd.conf
        - name: sssd-run
          mountPath: /run/sssd
        - name: sssd-pipes
          mountPath: /var/lib/sss/pipes
      volumes:
      - name: sssd-conf
        configMap:
          name: sssd-conf
          defaultMode: 0600
      - name: sssd-conf-staged
        emptyDir:
          medium: Memory
      - name: sssd-run
        emptyDir: {}
      - name: sssd-pipes
        emptyDir: {}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yarn-timelineserver
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-kdc
        image: zookage-util
        args:
        - wait-for-rollout
        - deployment/kerberos-kdc
