apiVersion: v1
kind: ConfigMap
metadata:
  name: config-values
data:
  hadoop_security_authorization: "true"
  hadoop_dfs_namenode_inode_attributes_provider_class: org.apache.ranger.authorization.hadoop.RangerHdfsAuthorizer
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hdfs-namenode
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-ranger-setup
        image: zookage-util
        args:
        - wait-for-job
        - ranger-policies
      - name: wait-for-dns
      - name: format
        env:
        - name: HADOOP_CLASSPATH
          value: /opt/ranger/ranger-hdfs-plugin/lib/*
        volumeMounts:
        - name: ranger-src
          mountPath: /opt/ranger
          subPath: opt/ranger
      containers:
      - name: namenode
        env:
        - name: HADOOP_CLASSPATH
          value: /opt/ranger/ranger-hdfs-plugin/lib/*
        volumeMounts:
        - name: ranger-src
          mountPath: /opt/ranger
          subPath: opt/ranger
      volumes:
      - name: ranger-src
        image:
          reference: zookage-ranger
          pullPolicy: IfNotPresent
