apiVersion: v1
kind: ConfigMap
metadata:
  name: config-values
data:
  hadoop_yarn_acl_enable: "true"
  hadoop_yarn_authorization_provider: "org.apache.ranger.authorization.yarn.authorizer.RangerYarnAuthorizer"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yarn-resourcemanager
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-ranger-setup
        image: zookage-util
        args:
        - wait-for-job
        - ranger-policies
      containers:
      - name: resourcemanager
        env:
        - name: HADOOP_CLASSPATH
          value: /opt/ranger/ranger-yarn-plugin/lib/*
        volumeMounts:
        - name: ranger-src
          mountPath: /opt/ranger
          subPath: opt/ranger
      volumes:
      - name: ranger-src
        image:
          reference: zookage-ranger
          pullPolicy: IfNotPresent
