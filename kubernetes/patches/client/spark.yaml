apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: client-node
spec:
  template:
    spec:
      containers:
      - name: sleep
        volumeMounts:
        # Spark SQL needs the Hive metastore connection and authentication settings.
        - name: hive-conf
          mountPath: /etc/hive/conf
        - name: spark-conf
          mountPath: /etc/spark/conf
        - name: spark-src
          mountPath: /opt/spark
          subPath: opt/spark
      volumes:
      - name: hive-conf
        configMap:
          name: hive-conf
      - name: spark-conf
        configMap:
          name: spark-conf
      - name: spark-src
        image:
          reference: zookage-spark
          pullPolicy: IfNotPresent
