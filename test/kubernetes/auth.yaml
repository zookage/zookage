apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
- includeSelectors: true
  pairs:
    owner: zookage
namespace: zookage
resources:
- base/client
- base/common
- base/console
- base/hbase
- base/hdfs
- base/hive
- base/hive-metastore
- base/kerberos
- base/keycloak
- base/mapreduce
- base/openldap
- base/ozone
- base/postgres
- base/ranger
- base/spark
- base/tez
- base/trino
- base/yarn
- base/zookeeper
images:
- name: zookage-util
  newName: zookage/zookage-util
  newTag: experimental
- name: zookage-console
  newName: zookage/zookage-console
  newTag: experimental
- name: zookage-hadoop
  newName: zookage/zookage-hadoop
  newTag: experimental
- name: zookage-hbase
  newName: zookage/zookage-hbase
  newTag: 2.6.3-zookage-0.5
- name: zookage-hive
  newName: zookage/zookage-hive
  newTag: 4.2.0-zookage-0.5
- name: zookage-hive-metastore
  newName: zookage/zookage-hive-metastore
  newTag: 4.2.0-zookage-0.5
- name: zookage-kdc
  newName: zookage/zookage-kdc
  newTag: experimental
- name: zookage-keycloak
  newName: zookage/zookage-keycloak
  newTag: 26.5-zookage-0.5
- name: zookage-openldap
  newName: zookage/zookage-openldap
  newTag: experimental
- name: zookage-ozone
  newName: zookage/zookage-ozone
  newTag: 2.0.0-zookage-0.5
- name: zookage-postgres
  newName: postgres
  newTag: '18.3'
- name: zookage-ranger
  newName: zookage/zookage-ranger
  newTag: 2.7.0-zookage-0.5
- name: zookage-spark
  newName: zookage/zookage-spark
  newTag: 4.1.1-zookage-0.5
- name: zookage-tez
  newName: zookage/zookage-tez
  newTag: 0.10.5-zookage-0.5
- name: zookage-trino
  newName: zookage/zookage-trino
  newTag: 479-zookage-0.5
- name: zookage-zookeeper
  newName: zookage/zookage-zookeeper
  newTag: 3.9.4-zookage-0.5
patches:
- path: patches/authn/client.yaml
- path: patches/authn/hdfs.yaml
- path: patches/authn/hive.yaml
- path: patches/authn/hbase.yaml
- path: patches/authn/hive-metastore.yaml
- path: patches/authn/mapreduce.yaml
- path: patches/authn/ranger.yaml
- path: patches/authn/spark.yaml
- path: patches/authn/trino.yaml
- path: patches/authn/tez.yaml
- path: patches/authn/yarn.yaml
- path: patches/authz/hbase.yaml
- path: patches/authz/hdfs.yaml
- path: patches/authz/hive.yaml
- path: patches/authz/hive-metastore.yaml
- path: patches/authz/ozone.yaml
- path: patches/authz/trino.yaml
- path: patches/authz/yarn.yaml
